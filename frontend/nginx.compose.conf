map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|bingbot|bingpreview|yandex|baiduspider|duckduckbot|applebot|telegrambot|whatsapp|facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot|embedly)" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    # --- سئو: صفحه‌های سروری برای خزنده‌ها و پیش‌نمایش لینک ---
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;

    location @spa {
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = / {
        if ($is_crawler) {
            rewrite ^ /api/seo/home break;
            proxy_pass http://backend:8080;
        }
        try_files /index.html =404;
    }

    location ~ ^/products/(\d+)/?$ {
        if ($is_crawler) {
            rewrite ^/products/(\d+)/?$ /api/seo/products/$1 break;
            proxy_pass http://backend:8080;
        }
        try_files $uri /index.html;
    }

    location ~ ^/categories/([^/]+)/?$ {
        if ($is_crawler) {
            rewrite ^/categories/([^/]+)/?$ /api/seo/categories/$1 break;
            proxy_pass http://backend:8080;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30m;
    }
}
